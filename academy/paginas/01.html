<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
  <title>Front End Academy | Matrix do Conhecimento</title>

  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #000;
      overflow-x: hidden;
      font-family: 'JetBrains Mono', monospace;
      color: #cfecdb;
      position: relative;
      cursor: default;
    }

    /* MATRIX CANVAS - efeito de fundo */
    #matrix-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: -5;
      opacity: 0.3;
      transition: opacity 0.5s ease;
    }

    /* GRADE TECNOLÓGICA */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 255, 100, 0.07) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 255, 100, 0.07) 1px, transparent 1px);
      background-size: 45px 45px;
      z-index: -4;
      pointer-events: none;
    }

    /* EFEITO GLOW RADIAL */
    body::after {
      content: "";
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 30% 10%, rgba(0, 255, 120, 0.12), transparent 55%),
        radial-gradient(circle at 85% 80%, rgba(0, 255, 100, 0.08), transparent 60%);
      z-index: -3;
      pointer-events: none;
    }

    /* SCROLLBAR PERSONALIZADA */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #0a1a0f;
    }
    ::-webkit-scrollbar-thumb {
      background: #00ff88;
      border-radius: 10px;
    }

    .container {
      width: 100%;
      max-width: 1500px;
      margin: 0 auto;
      padding: 40px 40px 70px;
      position: relative;
      z-index: 2;
    }

    /* TOPO - TÍTULO PRINCIPAL */
    .topo {
      text-align: center;
      margin-bottom: 60px;
      position: relative;
    }

    .glitch-wrapper {
      display: inline-block;
      position: relative;
    }

    .topo h1 {
      font-size: 98px;
      font-weight: 800;
      color: #7dff7d;
      letter-spacing: 12px;
      text-transform: uppercase;
      text-shadow: 
        0 0 12px #00ff66,
        0 0 28px #00ff66,
        0 0 45px #00ff66;
      animation: pulseGlow 1.8s infinite alternate;
      transition: all 0.2s;
    }

    @keyframes pulseGlow {
      0% {
        text-shadow: 0 0 8px #00ff66, 0 0 18px #00ff66;
        opacity: 0.95;
      }
      100% {
        text-shadow: 0 0 22px #00ff66, 0 0 45px #00ff88, 0 0 70px #00ffaa;
        opacity: 1;
      }
    }

    .topo p {
      margin-top: 20px;
      color: #b8f2d0;
      font-size: 20px;
      letter-spacing: 4px;
      font-weight: 500;
      background: rgba(0, 20, 10, 0.6);
      display: inline-block;
      padding: 8px 28px;
      border-radius: 60px;
      backdrop-filter: blur(5px);
      border: 1px solid rgba(0, 255, 100, 0.5);
      box-shadow: 0 0 15px rgba(0,255,120,0.2);
    }

    /* GRID CARDS */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
      gap: 38px;
      margin-top: 10px;
    }

    /* CARD INDIVIDUAL */
    .card {
      position: relative;
      background: rgba(6, 12, 8, 0.82);
      backdrop-filter: blur(12px);
      border: 1.5px solid rgba(0, 255, 100, 0.35);
      border-radius: 32px;
      padding: 38px 22px 34px;
      transition: all 0.4s cubic-bezier(0.2, 0.9, 0.4, 1.1);
      cursor: pointer;
      overflow: hidden;
      box-shadow: 0 10px 25px -8px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255,255,255,0.05);
    }

    /* Efeito de brilho dinâmico no hover */
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(0, 255, 150, 0.12), transparent);
      transition: left 0.7s ease;
      pointer-events: none;
    }

    .card:hover::before {
      left: 100%;
    }

    .card:hover {
      transform: translateY(-12px) scale(1.02);
      border-color: #00ffaa;
      box-shadow: 0 0 28px rgba(0, 255, 120, 0.4), 0 20px 35px -12px black;
      background: rgba(8, 18, 12, 0.9);
    }

    /* ÍCONE TEC */
    .icon {
      width: 110px;
      height: 110px;
      margin: 0 auto 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 30px;
      background: rgba(0, 30, 20, 0.65);
      border: 1px solid rgba(0, 255, 100, 0.35);
      box-shadow: 0 0 20px rgba(0, 255, 100, 0.2);
      transition: all 0.3s;
    }

    .card:hover .icon {
      border-color: #00ffaa;
      box-shadow: 0 0 30px rgba(0, 255, 140, 0.4);
      transform: scale(1.02);
    }

    .icon img {
      width: 68px;
      height: 68px;
      object-fit: contain;
      filter: drop-shadow(0 0 8px #00ff88);
      transition: filter 0.3s;
    }

    .card:hover .icon img {
      filter: drop-shadow(0 0 14px #00ffaa);
    }

    /* TÍTULO DO CARD */
    .card h2 {
      text-align: center;
      color: #9eff9e;
      font-size: 30px;
      font-weight: 700;
      margin-bottom: 16px;
      letter-spacing: 2px;
      text-shadow: 0 0 8px rgba(0, 255, 100, 0.5);
      transition: 0.2s;
    }

    .card:hover h2 {
      text-shadow: 0 0 14px #00ffaa;
      letter-spacing: 2.5px;
    }

    /* DESCRIÇÃO */
    .card p {
      text-align: center;
      color: #c6e2d4;
      line-height: 1.65;
      font-size: 15px;
      font-weight: 400;
      margin-bottom: 18px;
    }

    /* BADGE INTERATIVA */
    .tech-badge {
      display: inline-block;
      margin-top: 12px;
      text-align: center;
      width: 100%;
      font-size: 12px;
      color: #4aff9e;
      letter-spacing: 1px;
      background: rgba(0, 255, 100, 0.1);
      padding: 5px 12px;
      border-radius: 40px;
      transition: 0.2s;
      border: 0.5px solid rgba(0, 255, 150, 0.3);
      backdrop-filter: blur(2px);
    }

    .card:hover .tech-badge {
      background: rgba(0, 255, 150, 0.25);
      color: #ccffdd;
      box-shadow: 0 0 8px #00ff88;
    }

    /* MODAL MODERNO (POPUP) */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      visibility: hidden;
      transition: all 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .modal-container {
      background: #0a1210;
      border: 2px solid #00ff88;
      border-radius: 44px;
      max-width: 520px;
      width: 90%;
      padding: 32px 28px;
      text-align: center;
      position: relative;
      box-shadow: 0 0 60px rgba(0, 255, 100, 0.3);
      transform: scale(0.95);
      transition: transform 0.25s cubic-bezier(0.2, 1.2, 0.4, 1);
    }

    .modal-overlay.active .modal-container {
      transform: scale(1);
    }

    .modal-container h3 {
      font-size: 38px;
      color: #7dff7d;
      margin-bottom: 20px;
      letter-spacing: 2px;
    }

    .modal-container p {
      color: #cef0e2;
      font-size: 18px;
      line-height: 1.5;
      margin: 20px 0;
    }

    .modal-icon {
      width: 80px;
      height: 80px;
      margin: 0 auto 15px;
    }

    .modal-icon img {
      width: 70px;
      filter: drop-shadow(0 0 8px #00ff88);
    }

    .close-modal {
      background: rgba(0, 255, 100, 0.2);
      border: 1px solid #00ffaa;
      color: #b3ffcf;
      padding: 12px 28px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: bold;
      font-size: 16px;
      border-radius: 50px;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 16px;
    }

    .close-modal:hover {
      background: #00ff88;
      color: #000;
      box-shadow: 0 0 20px #00ff88;
      border-color: #00ff88;
    }

    /* RODAPÉ DIGITAL */
    .footer-note {
      text-align: center;
      margin-top: 70px;
      font-size: 13px;
      color: #5baa7a;
      border-top: 1px dashed rgba(0, 255, 100, 0.3);
      padding-top: 30px;
      letter-spacing: 1.5px;
    }

    /* RESPONSIVO */
    @media (max-width: 900px) {
      .container {
        padding: 20px 20px 50px;
      }
      .topo h1 {
        font-size: 48px;
        letter-spacing: 6px;
      }
      .topo p {
        font-size: 14px;
        padding: 5px 16px;
      }
      .card {
        padding: 28px 16px;
      }
      .card h2 {
        font-size: 26px;
      }
      .icon {
        width: 85px;
        height: 85px;
      }
      .icon img {
        width: 52px;
        height: 52px;
      }
    }

    @keyframes flicker {
      0% { opacity: 0.95; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>

<canvas id="matrix-canvas"></canvas>

<div class="container">
  <header class="topo">
    <div class="glitch-wrapper">
      <h1>FRONT END</h1>
    </div>
    <p>✦ ESCOLHA UM TEMA PARA ACELERAR SEU CONHECIMENTO ✦</p>
  </header>

  <section class="cards" id="cardsGrid">
    <!-- Os cards serão gerados via JS com dados estruturados, mas também com fallback semântico -->
  </section>

  <div class="footer-note">
    <span>⚡ [ MATRIX ACADEMY ] ⚡</span> — Aprenda na prática, mergulhe no código
  </div>
</div>

<!-- MODAL ESTRUTURA -->
<div id="techModal" class="modal-overlay">
  <div class="modal-container">
    <div class="modal-icon" id="modalIcon"></div>
    <h3 id="modalTitle">HTML5</h3>
    <p id="modalDesc">Estrutura completa para páginas web modernas.</p>
    <button class="close-modal" id="closeModalBtn">🧬 ACESSAR CONTEÚDO</button>
  </div>
</div>

<script>
  // ======================== DADOS DOS CARDS (MELHORIAS E DETALHES) ========================
  const techData = [
{
    name: "HTML5",
    icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/html5/html5-original.svg",
    desc: "Semântica, acessibilidade e estrutura sólida para qualquer projeto web.",
    badge: "ESTRUTURA · TAG SEMÂNTICAS",

    // CAMINHO CORRETO
    path: "front end/aulas de html/aula.html"
},

    {
      name: "CSS3",
      icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/css3/css3-original.svg",
      desc: "Design responsivo, animações, Grid, Flexbox e estilos profissionais.",
      badge: "FLEX · GRID · ANIMAÇÕES",
      path: "#"
    },
    {
      name: "JAVASCRIPT",
      icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/javascript/javascript-original.svg",
      desc: "Lógica de programação, manipulação do DOM, APIs e interatividade total.",
      badge: "ES6+ · PROMISES · EVENTOS",
      path: "#"
    },
    {
      name: "REACT",
      icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/react/react-original.svg",
      desc: "Biblioteca moderna, hooks, componentes reutilizáveis e SPA dinâmicos.",
      badge: "HOOKS · VIRTUAL DOM",
      path: "#"
    },
    {
      name: "ANGULAR",
      icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/angularjs/angularjs-original.svg",
      desc: "Framework robusto, TypeScript, injeção de dependência e escalabilidade.",
      badge: "TYPE · RXJS · DIRETIVAS",
      path: "#"
    },
    {
      name: "BOOTSTRAP",
      icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/bootstrap/bootstrap-original.svg",
      desc: "Componentes prontos, sistema de grades e prototipagem rápida.",
      badge: "RESPONSIVIDADE · UTILITIES",
      path: "#"
    },
    {
      name: "SASS",
      icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/sass/sass-original.svg",
      desc: "Variáveis, mixins, aninhamento e arquitetura CSS profissional.",
      badge: "PREPROCESSADOR · MODULAR",
      path: "#"
    },
    {
      name: "FIGMA",
      icon: "https://cdn.jsdelivr.net/gh/devicons/devicon/icons/figma/figma-original.svg",
      desc: "UI/UX, prototipagem colaborativa e design system completo.",
      badge: "UI DESIGN · PROTÓTIPOS",
      path: "#"
    }
  ];

  // Capturar elementos
  const cardsContainer = document.getElementById('cardsGrid');
  const modalOverlay = document.getElementById('techModal');
  const modalTitle = document.getElementById('modalTitle');
  const modalDesc = document.getElementById('modalDesc');
  const modalIconDiv = document.getElementById('modalIcon');
  const closeModalBtn = document.getElementById('closeModalBtn');

  let currentTechPath = "#";

  // Função para gerar os cards dinamicamente (com melhorias visuais e interação)
  function renderCards() {
    cardsContainer.innerHTML = '';
    techData.forEach(tech => {
      const card = document.createElement('div');
      card.className = 'card';
      // Atributo com nome da tecnologia para rastreio
      card.setAttribute('data-tech', tech.name);
      
      // Estrutura interna
      card.innerHTML = `
        <div class="icon">
          <img src="${tech.icon}" alt="${tech.name}" loading="lazy">
        </div>
        <h2>${tech.name}</h2>
        <p>${tech.desc}</p>
        <div class="tech-badge">
          <i class="badge-icon">⚡</i> ${tech.badge}
        </div>
      `;
      
      // Evento de clique para abrir modal com dados
      card.addEventListener('click', (e) => {
        e.stopPropagation();
        currentTechPath = tech.path;
        // Preencher modal dinamicamente
        modalTitle.innerText = tech.name;
        modalDesc.innerText = `📘 ${tech.desc} \n\n🟢 Acesse os conteúdos exclusivos, videoaulas e materiais práticos sobre ${tech.name}.`;
        modalIconDiv.innerHTML = `<img src="${tech.icon}" alt="${tech.name}" style="width:70px; filter:drop-shadow(0 0 8px #00ff88);">`;
        
        // Abrir modal com efeito
        modalOverlay.classList.add('active');
      });
      
      cardsContainer.appendChild(card);
    });
  }

  // Fechar modal com botão + função de redirecionamento condicional
  function closeModalAndRedirect() {
    modalOverlay.classList.remove('active');
    // Se existir caminho válido e não for apenas "#" , podemos redirecionar.
    // Melhoria: Simula navegação para página de estudos do tema, 
    // mas também mantemos a base de melhoria com alerta informativo
    if (currentTechPath && currentTechPath !== "#") {
      // Simular navegação para página de estudos real (caso exista)
      window.location.href = currentTechPath;
    } else {
      // Como os links são ilustrativos, exibimos um toque tecnológico aprimorado.
      // Melhoria: mostramos um mini alerta customizado estiloso (usando modal já existente)
      // porém evitamos alert genérico, mostramos notificação na própria modal temporariamente
      const originalDesc = modalDesc.innerText;
      modalDesc.innerText = `🚀 Em breve: plataforma de estudos completa para ${modalTitle.innerText}!\n\n🔥 Novas aulas, projetos e desafios serão lançados em breve. Fique ligado!`;
      setTimeout(() => {
        if (modalOverlay.classList.contains('active')) {
          modalDesc.innerText = originalDesc;
        }
      }, 1800);
    }
  }

  // Botão do modal fecha (comportamento)
  closeModalBtn.addEventListener('click', closeModalAndRedirect);
  
  // Fechar ao clicar no overlay (fora da caixa)
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) {
      modalOverlay.classList.remove('active');
    }
  });
  
  // Fechar com tecla ESC
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && modalOverlay.classList.contains('active')) {
      modalOverlay.classList.remove('active');
    }
  });

  // ======================== MATRIX CANVAS MELHORADO + EFEITO DE CÓDIGO ========================
  const canvas = document.getElementById('matrix-canvas');
  const ctx = canvas.getContext('2d');

  // Conjunto de caracteres variado para o efeito matrix com estilo "dev"
  const chars = "01<>[]{}()#&%*+=@ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  let fontSize = 18;
  let columns;
  let drops = [];

  function setupMatrix() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    columns = Math.floor(canvas.width / fontSize);
    drops = [];
    for (let i = 0; i < columns; i++) {
      drops[i] = Math.random() * -120;
    }
  }

  window.addEventListener('resize', () => {
    setupMatrix();
  });

  function drawMatrix() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.07)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.font = `500 ${fontSize}px 'JetBrains Mono', monospace`;
    
    for (let i = 0; i < drops.length; i++) {
      const text = chars[Math.floor(Math.random() * chars.length)];
      const x = i * fontSize;
      const y = drops[i] * fontSize;
      
      // Gradiente de cor esverdeado para mais estilo
      const greenIntensity = 100 + Math.sin(Date.now() * 0.002 + i) * 40;
      ctx.fillStyle = `rgba(0, ${Math.floor(180 + Math.random() * 75)}, 80, 0.85)`;
      ctx.shadowColor = '#00ff66';
      ctx.shadowBlur = 6;
      ctx.fillText(text, x, y);
      
      if (y > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
    requestAnimationFrame(drawMatrix);
  }

  setupMatrix();
  // Inicia a animação com pedido de animação contínua (frame rate otimizado)
  requestAnimationFrame(drawMatrix);
  
  // Adiciona efeito de brilho interativo no mouse (camada extra)
  document.body.addEventListener('mousemove', (e) => {
    const { clientX, clientY } = e;
    const xPercent = (clientX / window.innerWidth) * 100;
    const yPercent = (clientY / window.innerHeight) * 100;
    document.body.style.setProperty('--mouse-x', `${xPercent}%`);
    document.body.style.setProperty('--mouse-y', `${yPercent}%`);
  });
  
  // Melhoria: pequeno efeito de tooltip sutil nos cards via CSS
  const style = document.createElement('style');
  style.textContent = `
    .card {
      transition: transform 0.3s cubic-bezier(0.2, 0.9, 0.5, 1.1), box-shadow 0.3s;
    }
    .card:active {
      transform: scale(0.98);
    }
  `;
  document.head.appendChild(style);
  
  // Inicializar renderização
  renderCards();
  
  // animação de entrada sutil no carregamento
  window.addEventListener('load', () => {
    const cardsNodes = document.querySelectorAll('.card');
    cardsNodes.forEach((card, idx) => {
      card.style.opacity = '0';
      card.style.transform = 'translateY(25px)';
      setTimeout(() => {
        card.style.transition = 'opacity 0.5s ease, transform 0.5s ease';
        card.style.opacity = '1';
        card.style.transform = 'translateY(0)';
      }, idx * 80);
    });
  });
  
  // Desabilita clique direito contextual (opcional para manter imersão)
  document.addEventListener('contextmenu', (e) => {
    if (e.target.closest('.card')) {
      e.preventDefault();
      return false;
    }
  });
</script>
</body>
</html>
